name: Build Kanata Warutsu Phonemizer

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out phonemizer project
        uses: actions/checkout@v4

      - name: Check out OpenUtau source for API references
        uses: actions/checkout@v4
        with:
          repository: openutau/OpenUtau
          path: OpenUtau

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build plugin
        shell: pwsh
        run: dotnet build KanataWarutsuPhonemizer.csproj --configuration Release --verbosity minimal

      - name: Upload DLL artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KanataWarutsuPhonemizer
          path: bin/Release/net10.0/KanataWarutsuPhonemizer.dll
          if-no-files-found: error

      - name: Publish GitHub Release
        if: success()
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ github.run_number }}-${{ github.run_attempt }}
          name: Kanata Warutsu Phonemizer build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          generate_release_notes: true
          files: bin/Release/net10.0/KanataWarutsuPhonemizer.dll

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            **/obj/project.assets.json
            **/bin/**/*.dll
          if-no-files-found: ignore
